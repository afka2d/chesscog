# Base configuration for piece classifier with balanced class weights
_BASE_: config://_classifier_base.yaml

DATASET:
  PATH: grey_background_dataset/pieces
  CLASSES:
    - black_bishop
    - black_king
    - black_knight
    - black_pawn
    - black_queen
    - black_rook
    - white_bishop
    - white_king
    - white_knight
    - white_pawn
    - white_queen
    - white_rook
  BATCH_SIZE: 32
  TRANSFORMS:
    CENTER_CROP: null
    RESIZE: [224, 448]
    RANDOM_HORIZONTAL_FLIP: null
    COLOR_JITTER:
      BRIGHTNESS: 0.2
      CONTRAST: 0.2
      SATURATION: 0.2
      HUE: 0.1

TRAINING:
  PHASES:
    - EPOCHS: 15
      OPTIMIZER:
        LEARNING_RATE: 0.001
        NAME: Adam
      PARAMS: all
      LOSS:
        NAME: CrossEntropyLoss
        # Inverse frequency weighting: more weight for less frequent classes
        CLASS_WEIGHTS: [1.5, 3.0, 1.5, 1.0, 3.0, 1.5, 1.5, 3.0, 1.5, 1.0, 3.0, 1.5]