DATASET:
  BATCH_SIZE: 32
  CLASSES:
  - black_bishop
  - black_king
  - black_knight
  - black_pawn
  - black_queen
  - black_rook
  - white_bishop
  - white_king
  - white_knight
  - white_pawn
  - white_queen
  - white_rook
  PATH: grey_background_dataset/pieces
  TRANSFORMS:
    CENTER_CROP: null
    COLOR_JITTER:
      BRIGHTNESS: 0.2
      CONTRAST: 0.2
      HUE: 0.1
      SATURATION: 0.2
    RANDOM_HORIZONTAL_FLIP: null
    RESIZE:
    - 224
    - 448
    SCALE:
      HORIZONTAL: null
      VERTICAL: null
    SHEAR: null
    TRANSLATE:
      HORIZONTAL: null
      VERTICAL: null
  WORKERS: 2
TRAINING:
  MODEL:
    NAME: ResNet
    REGISTRY: PIECE_CLASSIFIER
  PHASES:
  - EPOCHS: 15
    LOSS:
      CLASS_WEIGHTS:
      - 1.5
      - 3.0
      - 1.5
      - 1.0
      - 3.0
      - 1.5
      - 1.5
      - 3.0
      - 1.5
      - 1.0
      - 3.0
      - 1.5
      NAME: CrossEntropyLoss
    OPTIMIZER:
      LEARNING_RATE: 0.001
      NAME: Adam
    PARAMS: all
