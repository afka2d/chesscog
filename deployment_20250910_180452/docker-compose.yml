version: '3.8'

services:
  chess-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=2
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
