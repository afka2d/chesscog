DATASET:
  BATCH_SIZE: 32
  CLASSES:
  - black_bishop
  - black_king
  - black_knight
  - black_pawn
  - black_queen
  - black_rook
  - white_bishop
  - white_king
  - white_knight
  - white_pawn
  - white_queen
  - white_rook
  PATH: grey_background_dataset/pieces
  TRANSFORMS:
    CENTER_CROP: null
    COLOR_JITTER:
      BRIGHTNESS: 0.3
      CONTRAST: 0.3
      HUE: 0.1
      SATURATION: 0.3
    RANDOM_HORIZONTAL_FLIP: 0.5
    RESIZE:
    - 224
    - 448
    SCALE:
      HORIZONTAL: null
      VERTICAL: null
    SHEAR: null
    TRANSLATE:
      HORIZONTAL: null
      VERTICAL: null
  WORKERS: 2
TRAINING:
  MODEL:
    NAME: ResNet
    REGISTRY: PIECE_CLASSIFIER
  PHASES:
  - EPOCHS: 10
    LOSS:
      CLASS_WEIGHTS:
      - 1.0
      - 1.2
      - 1.0
      - 0.8
      - 1.2
      - 1.0
      - 1.0
      - 1.2
      - 1.0
      - 0.8
      - 1.2
      - 1.0
      NAME: CrossEntropyLoss
    OPTIMIZER:
      LEARNING_RATE: 0.0005
      NAME: Adam
      WEIGHT_DECAY: 0.01
    PARAMS: all
